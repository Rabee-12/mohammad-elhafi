<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  let curCat = new URLSearchParams(location.search).get("cat") || "all";
  if (curCat !== "all" && !CATS[curCat]) curCat = "all";
  let curSort = "feat";

  function renderShop() {
    const lang = NOOR.lang;
    // filter pills
    document.getElementById("filters").innerHTML =
      [`<button class="f-pill ${curCat === "all" ? "on" : ""}" data-cat="all">${NOOR.t("f_all")}</button>`]
        .concat(Object.keys(CATS).map(c =>
          `<button class="f-pill ${curCat === c ? "on" : ""}" data-cat="${c}">${CATS[c][lang]}</button>`))
        .join("");
    document.querySelectorAll(".f-pill").forEach(b =>
      b.addEventListener("click", () => {
        curCat = b.dataset.cat;
        history.replaceState(null, "", curCat === "all" ? "shop.html" : `shop.html?cat=${curCat}`);
        renderShop();
      }));
    // sort select
    const sel = document.getElementById("sortSel");
    sel.innerHTML = `
      <option value="feat">${NOOR.t("sort_feat")}</option>
      <option value="low">${NOOR.t("sort_low")}</option>
      <option value="high">${NOOR.t("sort_high")}</option>`;
    sel.value = curSort;
    sel.onchange = () => { curSort = sel.value; renderShop(); };
    // grid
    let list = curCat === "all" ? [...PRODUCTS] : PRODUCTS.filter(p => p.cat === curCat);
    if (curSort === "low") list.sort((a, b) => a.price - b.price);
    if (curSort === "high") list.sort((a, b) => b.price - a.price);
    document.getElementById("resCount").textContent = `${list.length} ${NOOR.t("results")}`;
    document.getElementById("shopGrid").innerHTML =
      list.map((p, i) => productCard(p, i % 4)).join("");
    // footer links
    document.querySelectorAll("[data-cat-link]").forEach(a => {
      a.textContent = CATS[a.dataset.catLink][lang];
    });
    watchReveals();
  }
  document.addEventListener("noor:ready", renderShop);
  document.addEventListener("noor:lang", renderShop);
</script>
</body>
