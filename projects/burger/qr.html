<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>8one Burger — QR Code</title>
<link rel="icon" type="image/png" href="img/logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{ --amber:#F9A93C; --amber-deep:#e07b10; --char:#2B2E4A; --char-deep:#1c1e30; --cream:#fff6ea; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; font-family:"Baloo 2",system-ui,sans-serif; color:#2B2E4A;
    background:linear-gradient(135deg,#1c1e30,#2B2E4A 45%,#5a3a1e); background-size:200% 200%;
    display:flex; flex-direction:column; align-items:center; padding:1.6rem 1rem 3rem;
  }
  .page-logo{ width:160px; height:auto; background:linear-gradient(150deg,#fffaf2,#ffeccd); padding:.8rem 1rem; border-radius:18px; filter:drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
  h1{ color:#fff; font-weight:800; text-align:center; margin:1rem 0 1.2rem; font-size:1.2rem; }
  .panel{ background:var(--cream); border-radius:22px; padding:1.2rem; width:100%; max-width:420px; box-shadow:0 24px 60px -20px rgba(0,0,0,.5); }
  label{ font-weight:700; font-size:.85rem; color:var(--char); display:block; margin:0 0 .35rem; }
  input{ width:100%; padding:.7rem .9rem; border:2px solid #f0ddc2; border-radius:12px; font-family:inherit; font-size:.95rem; }
  input:focus{ outline:none; border-color:var(--amber); }
  button{ font-family:inherit; font-weight:800; border:none; cursor:pointer; border-radius:12px; }
  .row{ display:flex; gap:.6rem; margin-top:.7rem; }
  .gen{ flex:1; padding:.8rem; background:linear-gradient(135deg,var(--amber),var(--amber-deep)); color:var(--char-deep); }
  .dl{ flex:1; padding:.8rem; background:var(--char); color:#fff; }
  .gen:active,.dl:active{ transform:scale(.98); }

  /* the printable card */
  .card{ margin:1.3rem auto 0; width:300px; background:#fff; border-radius:20px; padding:20px 18px 22px; text-align:center; box-shadow:0 10px 30px -12px rgba(28,30,48,.5); }
  .card-logo{ width:150px; height:auto; margin:0 auto .7rem; display:block; }
  canvas{ width:240px; height:240px; }
  .scan{ margin-top:.7rem; font-weight:800; color:var(--char); font-size:1rem; }
  .scan small{ display:block; font-weight:700; color:#9a8d7c; font-size:.72rem; margin-top:.15rem; }
  .hint{ color:#fff; opacity:.85; font-size:.8rem; text-align:center; margin-top:1.4rem; max-width:420px; }
</style>
</head>
<body>
  <img class="page-logo" src="img/logo.png" alt="8one Burger" />
  <h1>Table QR Code</h1>

  <div class="panel">
    <label for="url">Menu link (your live URL)</label>
    <input id="url" type="url" placeholder="https://your-menu.netlify.app" />
    <div class="row">
      <button class="gen" id="gen">Generate</button>
      <button class="dl" id="dl">Download PNG</button>
    </div>
  </div>

  <!-- printable card -->
  <div class="card" id="card">
    <img class="card-logo" src="img/logo.png" alt="8one Burger" />
    <canvas id="qr" width="600" height="600"></canvas>
    <div class="scan">SCAN FOR MENU
      <small>menü için tara · امسح للقائمة</small>
    </div>
  </div>

  <p class="hint">Tip: paste your live link, hit Generate, then Download PNG — print it or stick it on the tables. Re-generate anytime if your domain changes.</p>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script>
  const urlInput = document.getElementById("url");
  const canvas = document.getElementById("qr");
  const ctx = canvas.getContext("2d");

  const guess = location.origin + "/";
  urlInput.value = guess;

  const logo = new Image();
  logo.src = "img/logo.png";
  logo.onload = draw;

  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function draw(){
    const value = urlInput.value.trim() || guess;
    new QRious({ element: canvas, value, size: 600, level: "H",
                 background: "#ffffff", foreground: "#2B2E4A" });
    // bake the logo into the middle on a white pad
    if(logo.complete && logo.naturalWidth){
      const s = canvas.width;
      const box = s * 0.26;                  // wide logo → a bit larger
      const ratio = logo.naturalHeight / logo.naturalWidth;
      const bw = box, bh = box * ratio;
      const pad = box * 0.12;
      const x = (s - bw) / 2, y = (s - bh) / 2;
      ctx.fillStyle = "#ffffff";
      roundRect(ctx, x - pad, y - pad, bw + pad*2, bh + pad*2, 16);
      ctx.fill();
      ctx.drawImage(logo, x, y, bw, bh);
    }
  }
  function download(){
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "8oneburger-menu-qr.png";
    a.click();
  }
  document.getElementById("gen").addEventListener("click", draw);
  document.getElementById("dl").addEventListener("click", download);
  draw();
</script>
</body>
</html>
